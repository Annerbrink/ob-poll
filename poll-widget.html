<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 X 2 Poll</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #262d38;
    --text: #e6edf3;
    --muted: #8b96a5;
    --accent: #3fb950;
    --accent-soft: rgba(63, 185, 80, .16);
    --track: #21262d;
    --bar: #4b5563;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --line: #e3e6ea;
      --text: #14181d;
      --muted: #616b78;
      --accent: #1a7f37;
      --accent-soft: rgba(26, 127, 55, .1);
      --track: #eef0f3;
      --bar: #b6bdc7;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg); }

  body {
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }

  .poll {
    max-width: 440px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
  }

  .label {
    margin: 0;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 { margin: 8px 0 4px; font-size: 19px; line-height: 1.35; }

  .kickoff { margin: 0; font-size: 13px; color: var(--muted); }

  .question { margin: 20px 0 10px; font-size: 13px; color: var(--muted); }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 12px 6px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }

  .choice:hover { border-color: var(--accent); }
  .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
  .choice .sign { font-size: 20px; font-weight: 700; }
  .choice .team {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    overflow-wrap: anywhere;
  }

  .results { margin-top: 22px; display: grid; gap: 14px; }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 13px;
  }

  .head .name { font-weight: 600; }
  .head .pct { font-variant-numeric: tabular-nums; font-weight: 700; }

  .track { height: 9px; border-radius: 999px; background: var(--track); overflow: hidden; }

  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--bar);
    transition: width .4s ease;
  }

  .row.mine .fill { background: var(--accent); }

  .count { margin: 5px 0 0; font-size: 11px; color: var(--muted); }

  footer {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    color: var(--muted);
  }

  footer p { margin: 0; }

  .reset {
    border: 0;
    background: none;
    padding: 0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Configure via the data-* attributes below (or ?home=…&away=…&kickoff=… on the iframe src). -->
<section class="poll"
         id="poll"
         data-poll-id="ois-ifk-2026-08-08"
         data-home="Örgryte IS"
         data-away="IFK Göteborg"
         data-kickoff="2026-08-08T17:00:00+02:00">
  <p class="label">Match poll</p>
  <h1 id="fixture"></h1>
  <p class="kickoff" id="kickoff"></p>

  <p class="question">Who wins?</p>

  <div class="choices" id="choices">
    <button class="choice" type="button" data-choice="1">
      <span class="sign">1</span><span class="team" data-slot="home"></span>
    </button>
    <button class="choice" type="button" data-choice="X">
      <span class="sign">X</span><span class="team">Draw</span>
    </button>
    <button class="choice" type="button" data-choice="2">
      <span class="sign">2</span><span class="team" data-slot="away"></span>
    </button>
  </div>

  <div class="results" id="results"></div>

  <footer>
    <p id="total"></p>
    <button class="reset" type="button" id="reset">Reset my vote</button>
  </footer>
</section>

<script>
(function () {
  var poll = document.getElementById('poll');
  var params = new URLSearchParams(location.search);

  var config = {
    id: params.get('id') || poll.dataset.pollId,
    home: params.get('home') || poll.dataset.home,
    away: params.get('away') || poll.dataset.away,
    kickoff: params.get('kickoff') || poll.dataset.kickoff
  };

  var OPTIONS = ['1', 'X', '2'];
  var LABELS = { '1': config.home, 'X': 'Draw', '2': config.away };
  var STORAGE_KEY = 'poll:' + config.id;

  var state = read();

  function read() {
    var blank = { counts: { '1': 0, 'X': 0, '2': 0 }, vote: null };
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!saved || !saved.counts) return blank;
      OPTIONS.forEach(function (o) {
        blank.counts[o] = Math.max(0, parseInt(saved.counts[o], 10) || 0);
      });
      blank.vote = OPTIONS.indexOf(saved.vote) > -1 ? saved.vote : null;
      return blank;
    } catch (e) {
      return blank;
    }
  }

  function write() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function total() {
    return OPTIONS.reduce(function (sum, o) { return sum + state.counts[o]; }, 0);
  }

  // Largest-remainder rounding so the displayed percentages always add up to 100.
  function percentages() {
    var sum = total();
    if (!sum) return { '1': 0, 'X': 0, '2': 0 };

    var exact = OPTIONS.map(function (o) { return state.counts[o] / sum * 100; });
    var whole = exact.map(Math.floor);
    var left = 100 - whole.reduce(function (a, b) { return a + b; }, 0);

    exact
      .map(function (value, i) { return { i: i, frac: value - whole[i] }; })
      .sort(function (a, b) { return b.frac - a.frac; })
      .slice(0, left)
      .forEach(function (entry) { whole[entry.i] += 1; });

    return { '1': whole[0], 'X': whole[1], '2': whole[2] };
  }

  var rows = {};
  OPTIONS.forEach(function (option) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="head"><span class="name"></span><span class="pct">0%</span></div>' +
      '<div class="track"><div class="fill"></div></div>' +
      '<p class="count"></p>';
    row.querySelector('.name').textContent = option + ' · ' + LABELS[option];
    document.getElementById('results').appendChild(row);
    rows[option] = row;
  });

  function render() {
    var pct = percentages();
    var sum = total();

    OPTIONS.forEach(function (option) {
      var row = rows[option];
      row.classList.toggle('mine', state.vote === option);
      row.querySelector('.pct').textContent = pct[option] + '%';
      row.querySelector('.fill').style.width = pct[option] + '%';
      row.querySelector('.count').textContent =
        state.counts[option] + (state.counts[option] === 1 ? ' vote' : ' votes');

      document.querySelector('.choice[data-choice="' + option + '"]')
        .classList.toggle('selected', state.vote === option);
    });

    document.getElementById('total').textContent =
      sum === 0 ? 'No votes yet' : sum + (sum === 1 ? ' vote' : ' votes') + ' · ' +
      (state.vote ? 'you picked ' + state.vote : 'pick 1, X or 2');
  }

  document.getElementById('fixture').textContent = config.home + ' – ' + config.away;
  document.querySelector('[data-slot="home"]').textContent = config.home;
  document.querySelector('[data-slot="away"]').textContent = config.away;

  var kickoff = new Date(config.kickoff);
  document.getElementById('kickoff').textContent = isNaN(kickoff)
    ? ''
    : kickoff.toLocaleString(undefined, {
        weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });

  document.getElementById('choices').addEventListener('click', function (event) {
    var button = event.target.closest('.choice');
    if (!button) return;

    var choice = button.dataset.choice;
    if (state.vote === choice) return;
    if (state.vote) state.counts[state.vote] -= 1;

    state.counts[choice] += 1;
    state.vote = choice;
    write();
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!state.vote) return;
    state.counts[state.vote] -= 1;
    state.vote = null;
    write();
    render();
  });

  render();
})();
</script>
</body>
</html>
